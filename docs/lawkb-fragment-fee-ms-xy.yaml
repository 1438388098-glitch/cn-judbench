- law_id: npc_civil_procedure_law
  article_no: '128'
  version_id: msf_128_2023
  effective_from: '2024-01-01'
  effective_to: null
  superseded_by: null
  note: 第一百二十八条（答辩期 15 日）；2017 及更早为第一百二十五条
  text_ref: inline
  text: |-
    第一百二十八条　人民法院应当在立案之日起五日内将起诉状副本发送被告，被告应当在收到之日起十五日内提出答辩状。答辩状应当记明被告的姓名、性别、年龄、民族、职业、工作单位、住所、联系方式；法人或者其他组织的名称、住所和法定代表人或者主要负责人的姓名、职务、联系方式。人民法院应当在收到答辩状之日起五日内将答辩状副本发送原告。被告不提出答辩状的，不影响人民法院审理。
  verify: flk_toc_ok_text_pending
