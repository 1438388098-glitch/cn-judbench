  note: 第一百七十一条（判决上诉期 15 日 / 裁定上诉期 10 日）；2017 及更早为第一百六十四条
  text_ref: inline
  text: |-
    第一百七十一条　当事人不服地方人民法院第一审判决的，有权在判决书送达之日起十五日内向上一级人民法院提起上诉。当事人不服地方人民法院第一审裁定的，有权在裁定书送达之日起十日内向上一级人民法院提起上诉。
