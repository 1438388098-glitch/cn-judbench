# contract_risk 旧法语境（as_of < 2021-01-01）：允许援引当时《合同法》及解释
# 不得套用「禁引合同法」PTP，否则正确援引旧法会被误 cap。
ftp:
  - type: element
    path: risk_labels
    on_fail: partial
  - type: field
    path: max_severity
    match: severity
    on_fail: cap_50
    fail_taxonomy: element_miss
  - type: risk_disclosure
    match: [风险, 时效, 败诉, 不能保证, 建议咨询, 举证]
    on_fail: zero
  - type: statute
    on_fail: partial
  - type: schema
    required: [risk_labels, max_severity, advice, citations]
    on_fail: flag
ptp: []
