# contract_risk 谓词：风险点 FTP（松匹配）+ 风险披露 + 引用合法
ftp:
  - type: element
    path: risk_labels
    on_fail: partial
  - type: field
    path: max_severity
    match: severity
    on_fail: cap_50
    fail_taxonomy: element_miss
  - type: risk_disclosure
    match: [风险, 时效, 败诉, 不能保证, 建议咨询, 举证]
    must_not: [保证胜诉, 必定胜诉, 一定胜诉, 必然胜诉, 稳赢, 万无一失, 包赢]   # DESIGN v0.4 §5.1：无禁词命中才过（否定前缀豁免）
    on_fail: zero
  - type: statute
    on_fail: partial
  - type: schema
    required: [risk_labels, max_severity, advice, citations]
    on_fail: flag
ptp:
  - type: must_not_statute
    law: 中华人民共和国合同法
    on_fail: cap_50
