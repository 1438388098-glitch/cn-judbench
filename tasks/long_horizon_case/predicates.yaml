# long_horizon：终态字段 + 阶段覆盖 + progress 诊断（structured 不用 progress_keyword）
ftp:
  - type: element
    path: phases_done
    on_fail: partial
  - type: field
    path: risk_level
    on_fail: cap_50
    fail_taxonomy: element_miss
  - type: field
    path: matter_type
    on_fail: zero
    fail_taxonomy: element_miss
  - type: statute
    on_fail: partial
  - type: risk_disclosure
    match: [风险, 不能保证, 时效, 举证]
    on_fail: flag
  - type: schema
    required: [phases_done, matter_type, risk_level, next_steps, progress]
    on_fail: flag
ptp:
  - type: must_not_statute
    law: 中华人民共和国合同法
    on_fail: cap_50
diagnostic_ftp:
  - type: element
    path: progress
    on_fail: flag
