# a_irac_reason：长句用覆盖率 contains；rule_article 条号集合 partial；statute partial
ftp:
  - type: field
    path: issue
    match: contains
    on_fail: partial
    fail_taxonomy: structure_broken
  - type: field
    path: conclusion
    match: contains
    on_fail: partial
    fail_taxonomy: structure_broken
  - type: field
    path: rule_article
    match: article_set
    on_fail: partial
    fail_taxonomy: wrong_article
  - type: statute
    on_fail: partial
  - type: no_fabrication
    on_fail: zero
  - type: risk_disclosure
    match: [风险, 不能保证, 仅供参考, 建议咨询, 举证]
    on_fail: flag
  - type: schema
    required: [issue, rule_law, rule_article, application, conclusion, citations]
    on_fail: flag
ptp:
  - type: must_not_statute
    law: 中华人民共和国合同法
    on_fail: cap_50
diagnostic_ftp:
  - type: element
    path: issue
    on_fail: flag
