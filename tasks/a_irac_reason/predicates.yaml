# a_irac_reason：issue/conclusion 为开放式文本，0.80 字符覆盖率等于要求考生
# 复述金样（R15 真考生实证：结构/引用谓词全 PASS 而被文本覆盖拖至 36 分），
# 无判分效度——降为 flag 出灯号不进基数；机检基数只留 结构化条号 + 引用效力 + 禁编造。
ftp:
  - type: field
    path: issue
    match: contains
    on_fail: flag
    fail_taxonomy: structure_broken
  - type: field
    path: conclusion
    match: contains
    on_fail: flag
    fail_taxonomy: structure_broken
  - type: field
    path: rule_article
    match: article_set
    on_fail: partial
    fail_taxonomy: wrong_article
  - type: statute
    on_fail: partial
  - type: no_fabrication
    on_fail: zero
  - type: risk_disclosure
    match: [风险, 不能保证, 仅供参考, 建议咨询, 举证]
    on_fail: flag
  - type: schema
    required: [issue, rule_law, rule_article, application, conclusion, citations]
    on_fail: flag
ptp:
  - type: must_not_statute
    law: 中华人民共和国合同法
    on_fail: cap_50
diagnostic_ftp:
  - type: element
    path: issue
    on_fail: flag
