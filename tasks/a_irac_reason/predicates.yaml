# a_irac_reason：IRAC 锚点机检 + 引用；说理进 Judge（无自由文本 PTP）
# 注：progress_keyword 仅适用 exact/gen/tool_call，structured 用 element 覆盖 IRAC 键
ftp:
  - type: field
    path: issue
    on_fail: cap_50
    fail_taxonomy: structure_broken
  - type: field
    path: conclusion
    on_fail: cap_50
    fail_taxonomy: structure_broken
  - type: field
    path: rule_article
    on_fail: zero
    fail_taxonomy: wrong_article
  - type: statute
    on_fail: zero
  - type: no_fabrication
    on_fail: zero
  - type: risk_disclosure
    match: [风险, 不能保证, 仅供参考, 建议咨询, 举证]
    on_fail: flag
  - type: schema
    required: [issue, rule_law, rule_article, application, conclusion, citations]
    on_fail: flag
ptp:
  - type: must_not_statute
    law: 中华人民共和国合同法
    on_fail: cap_50
diagnostic_ftp:
  - type: element
    path: issue
    on_fail: flag
