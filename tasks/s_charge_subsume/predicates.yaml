# s_charge_subsume：罪名 zero 仍一票否决；要件/引用改 partial（真实评测复盘）
ftp:
  - type: field              # 罪名错 → 一票否决
    path: charge
    fail_taxonomy: element_miss
    on_fail: zero
  - type: element            # 要件集合 F1（含归一化/包含）
    path: elements
    on_fail: partial
  - type: statute            # 锚点覆盖；同法异条记 PASS 比例，stale/未引 → FAIL+zero
    on_fail: zero
  - type: schema
    required: [charge, elements, citations, defendant_name]
    on_fail: flag
ptp:
  - type: must_not_statute   # 禁引：治安处罚不是刑事定罪依据
    law: 治安管理处罚法
    on_fail: cap_50
  - type: field_keep         # 被告人是输入已知事实，不得改写
    path: defendant_name
    on_fail: cap_50
